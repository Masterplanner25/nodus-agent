[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nodus-agent"
version = "0.1.0"
description = "Full AI agent execution lifecycle: plan, approve, execute, guardrails, capability tokens"
authors = [{ name = "Shawn Knight" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/Masterplanner25/nodus-agent"
Repository = "https://github.com/Masterplanner25/nodus-agent"

[tool.setuptools.packages.find]
where = ["."]
include = ["nodus_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
